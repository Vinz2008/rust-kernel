[unstable]
json-target-spec = true
build-std-features = ["compiler-builtins-mem"]
build-std = ["core", "compiler_builtins", "alloc"]

[build]
target = "x86_64-unknown-kernel.json"
rustflags = ["-C", "force-frame-pointers=yes"]

[target.x86_64-unknown-kernel]
rustflags = [
    "-Z", "stack-protector=strong",
]

[target.x86_64-unknown-rust_kernel]
rustflags = [
    "-Z", "stack-protector=strong",
]

[target.'cfg(target_os = "none")']
runner = "bootimage runner"


[alias]
build-userspace = "build -p init -p cli -p ls -p shutdown -p touch -p cat -p reboot --target x86_64-unknown-rust_kernel.json"