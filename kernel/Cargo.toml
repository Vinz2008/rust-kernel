[package]
name = "rust-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
#bootloader = { version = "0.9", features = ["map_physical_memory"] }
bootloader = { path = "../bootloader", features = ["map_physical_memory", "sse"] }
spin = "0.12.0"
x86_64 = "0.15.4"
uart_16550 = "0.6.0"
#pic8259 = "0.11.0"
pc-keyboard = "0.9.0"
arrayvec = { version = "0.7.6", default-features = false }
linked_list_allocator = "0.10.6"
elf = { version = "0.8.0", default-features = false, features = ["alloc", "to_str"] } # TODO : try to remove alloc feature ? and the to_str feature ?
shared_consts = { path = "../shared_consts" }
raw-cpuid = "11.6.0"
acpi = "6.1.1"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[package.metadata.bootimage]
run-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-enable-kvm", "-cpu", "host"]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-timeout = 300
test-success-exit-code = 33

[package.metadata.bootloader]
kernel-stack-address = "0xFFFFFFFF7FCFF000"
kernel-stack-size = 512 # 2 MiB
physical-memory-offset = "0xFFFFFE0000000000"
boot-info-address = "0xFFFFFFFF7FF00000"
