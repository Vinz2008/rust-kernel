[workspace]
resolver = "3"
members = [
    "kernel",
    "init",
    "rt",
    "userspace/cli",
    "userspace/ls", 
    "shared_consts", "userspace/shutdown",
]
default-members = ["kernel"]
exclude = [
    "bootloader",
]

[profile.release]
opt-level = 2
strip = "symbols"
overflow-checks = true
lto = "fat"

# TODO : change this ?
[profile.release.package.bootloader]
debug = true